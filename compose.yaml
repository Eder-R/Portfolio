services:

  libmanager:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: libmanager

    volumes:
      - libmanager-data:/app/database

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    container_name: libmanager-nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - libmanager

    restart: unless-stopped

volumes:
  libmanager-data: