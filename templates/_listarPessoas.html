<div class="w3-padding-large" id="main">
  <div class="content-section" id="pessoas">
    <div class="pessoas-container">
      <div class="title">Pessoas Cadastradas</div>
        <div class="table-responsive">
        <table class="table table-striped table-bordered">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Sala</th>
              <th>Matrícula</th>
              <!-- <th>Ações</th> -->
            </tr>
          </thead>
          <tbody>
            {% for pessoa in pessoas %}
              <tr>
                  <td>{{ pessoa.nome }}</td>
                  <td>{{ pessoa.sala }}</td>
                  <td>{{ pessoa.matricula }}</td>
              </tr>
            {% endfor %}
          </tbody>      
        </table>
        </div>
        <div class="pagination">
          <a class="w3-button w3-blue w3-padding-large w3-section" href="{{ url_for('cadastro_pessoas') }}">
              Cadastrar Pessoa
          </a>
      </div>
    </div>
  </div>
</div>
